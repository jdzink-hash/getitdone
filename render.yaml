# Render Blueprint: New → Blueprint → pick this repo. Render will ask for the values marked sync: false.
services:
  - type: web
    name: getitdone
    runtime: python
    plan: starter            # needed for the persistent disk and so the app never sleeps (morning emails)
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 8 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /login
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/getitdone.db
      - key: SECURE_COOKIES
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: RUN_SCHEDULER
        value: "1"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
